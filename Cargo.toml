[package]
name = "webpad"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
hyper = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vigem-client = { version = "0.1.4", features = ["unstable_xtarget_notification"] }
portmapper = "0.19"
rustls = "0.23"
rustls-pemfile = "2"
rcgen = "0.13"
tokio-rustls = "0.26"
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio", "server", "service"] }
http-body = "1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
tokio-util = "0.7"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
argon2 = "0.5"

[features]
default = []

[dev-dependencies]
tower = "0.5"